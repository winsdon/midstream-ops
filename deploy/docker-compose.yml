# =============================================================================
# midstream-ops 部署配置
# =============================================================================
# 快速开始：
#   1. cp .env.example .env
#   2. 按下方说明填写（至少 JWT_SECRET / CREDENTIALS_KEY / DB 密码）
#   3. docker compose up -d
#   4. curl http://127.0.0.1:9090/health
#
# 本项目只用 SQLite 存自己的数据，Postgres 是【只读连接已有的 sub2api 库】，
# 所以这里只有一个容器，不需要起 postgres / redis。
# =============================================================================

services:
  monitor:
    image: ${MONITOR_IMAGE:-winsdon8/midstream-ops:latest}
    container_name: sub2api-monitor
    restart: unless-stopped

    ports:
      # 默认只绑 127.0.0.1：本站含成本、利润、客户授信与 KYC 等敏感数据，
      # 不应直接裸露公网。对外访问请在宿主机用 Nginx/Caddy 反代 + TLS。
      - "${BIND_HOST:-127.0.0.1}:${MONITOR_PORT:-9090}:9090"

    volumes:
      # 必须挂【目录】而非单个 .db 文件：SQLite 开了 WAL，
      # 运行时会在同目录产生 monitor.db-wal / monitor.db-shm。
      - monitor_data:/app/data

    environment:
      # ---------------------------------------------------------------------
      # 服务端
      # ---------------------------------------------------------------------
      - MONITOR_SERVER_HOST=0.0.0.0
      - MONITOR_SERVER_PORT=9090
      # 须与 sub2api 主站一致，影响「今日」口径与对账
      - MONITOR_TIMEZONE=${TZ:-Asia/Shanghai}
      - TZ=${TZ:-Asia/Shanghai}

      # ---------------------------------------------------------------------
      # 登录与密钥
      # ---------------------------------------------------------------------
      - MONITOR_AUTH_USERNAME=${MONITOR_AUTH_USERNAME:-admin}
      - MONITOR_AUTH_PASSWORD=${MONITOR_AUTH_PASSWORD:?MONITOR_AUTH_PASSWORD 必填}
      - MONITOR_AUTH_JWT_SECRET=${MONITOR_AUTH_JWT_SECRET:?MONITOR_AUTH_JWT_SECRET 必填，须 ≥32 字节}
      - MONITOR_AUTH_TOKEN_TTL_HOURS=${MONITOR_AUTH_TOKEN_TTL_HOURS:-24}
      # 凭据与 KYC 的 PII 加密密钥。不配则明文落库，详见 .env.example 的警告。
      - MONITOR_CREDENTIALS_KEY=${MONITOR_CREDENTIALS_KEY:?MONITOR_CREDENTIALS_KEY 必填}

      # ---------------------------------------------------------------------
      # 上游 sub2api Postgres（只读）
      # ---------------------------------------------------------------------
      # 同宿主接入 sub2api 网络时，host 直接写它的 postgres 容器名。
      - MONITOR_SUB2API_DB_HOST=${MONITOR_SUB2API_DB_HOST:-sub2api-postgres}
      - MONITOR_SUB2API_DB_PORT=${MONITOR_SUB2API_DB_PORT:-5432}
      - MONITOR_SUB2API_DB_USER=${MONITOR_SUB2API_DB_USER:?只读账号必填}
      - MONITOR_SUB2API_DB_PASSWORD=${MONITOR_SUB2API_DB_PASSWORD:?只读账号密码必填}
      - MONITOR_SUB2API_DB_DBNAME=${MONITOR_SUB2API_DB_DBNAME:-sub2api}
      - MONITOR_SUB2API_DB_SSLMODE=${MONITOR_SUB2API_DB_SSLMODE:-disable}

      # ---------------------------------------------------------------------
      # 本地存储
      # ---------------------------------------------------------------------
      # 绝对路径：不依赖进程工作目录
      - MONITOR_SQLITE_PATH=/app/data/monitor.db

      # ---------------------------------------------------------------------
      # 采集周期（分钟）
      # ---------------------------------------------------------------------
      - MONITOR_BALANCE_INTERVAL_MINUTES=${MONITOR_BALANCE_INTERVAL_MINUTES:-30}
      - MONITOR_COST_INTERVAL_MINUTES=${MONITOR_COST_INTERVAL_MINUTES:-10}
      - MONITOR_COST_RETENTION_DAYS=${MONITOR_COST_RETENTION_DAYS:-180}
      - MONITOR_PROBE_INTERVAL_MINUTES=${MONITOR_PROBE_INTERVAL_MINUTES:-15}
      - MONITOR_RATES_INTERVAL_MINUTES=${MONITOR_RATES_INTERVAL_MINUTES:-5}

      # ---------------------------------------------------------------------
      # 模型广场 / KYC 嵌入页（可选，默认关闭）
      # ---------------------------------------------------------------------
      - MONITOR_PLAZA_ENABLED=${MONITOR_PLAZA_ENABLED:-false}
      - MONITOR_PLAZA_SUB2API_BASE_URL=${MONITOR_PLAZA_SUB2API_BASE_URL:-}
      - MONITOR_PLAZA_SUB2API_JWT_SECRET=${MONITOR_PLAZA_SUB2API_JWT_SECRET:-}
      # 生产必须为 false：开启后可签发任意用户身份的 token
      - MONITOR_PLAZA_DEV_MODE=false

      - MONITOR_LOG_LEVEL=${MONITOR_LOG_LEVEL:-info}

    networks:
      - sub2api-network

    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://localhost:9090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  monitor_data:
    driver: local

networks:
  # 接入 sub2api 已有的网络，从而用容器名访问它的 Postgres。
  #
  # ⚠️ compose 会给网络名加项目名前缀，实际名字通常是 <目录名>_sub2api-network。
  #    部署前务必先确认真实名字，再填进 .env 的 SUB2API_NETWORK：
  #        docker network ls | grep sub2api
  sub2api-network:
    external: true
    name: ${SUB2API_NETWORK:-sub2api_sub2api-network}
