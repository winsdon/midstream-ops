server:
  host: 0.0.0.0
  port: 9090

timezone: Asia/Shanghai        # 须与 sub2api 的 timezone 一致（对账口径）

auth:
  username: admin
  password: "change-me"        # 明文；填 $2a$/$2b$ 开头则按 bcrypt 校验
  jwt_secret: ""               # 必填，32 字节以上随机串
  token_ttl_hours: 24

sub2api_db:                    # 线上库（只读；DSN 强制 default_transaction_read_only=on）
  host: 127.0.0.1
  port: 5432
  user: sub2api_readonly
  password: "<填入只读账号密码>"
  dbname: sub2api
  sslmode: disable

# 本项目自己的 monitor 库（可写）。与上游库可以是同一 PG 实例上的不同 database。
# 表结构启动时自动迁移，无需手工建表。PostgreSQL 15+ 须先 GRANT ALL ON SCHEMA public。
store_db:
  host: 127.0.0.1
  port: 5432
  user: monitor
  password: "<填入 monitor 库密码>"
  dbname: monitor
  sslmode: disable

balance:
  interval_minutes: 30
  timeout_seconds: 15
  concurrency: 3
  retention_days: 90

# 上游真实成本同步：定时拉取供应商 per-key 的 actual_cost（倍率折后实扣）落 monitor 库，
# 查询只读本地库。首次同步会回补 90 天历史，耗时较长。
cost:
  interval_minutes: 10         # 同步间隔
  timeout_seconds: 30
  concurrency: 2               # 并发同步的供应商数
  retention_days: 180          # 成本明细保留天数

probe:
  interval_minutes: 15
  timeout_seconds: 30
  concurrency: 2
  retention_days: 30
  default_models:
    anthropic: claude-3-5-haiku-20241022
    openai: gpt-4o-mini
    gemini: gemini-2.5-flash

rates:
  interval_minutes: 5
  retention_days: 365

# 模型广场：以 iframe 嵌入 sub2api 的只读页面（sub2api 后台配「自定义菜单页面」，
# URL 填 https://本站域名/embed/plaza）。
plaza:
  enabled: false
  # sub2api 站点 origin，用作 CSP frame-ancestors（只允许该站点嵌入本页）。
  sub2api_base_url: ""         # 如 https://your-sub2api.com
  # sub2api 的 jwt.secret，用于本地验签用户 token（须与对方完全一致）。
  #
  # 为何不回调 sub2api 的 /auth/me 校验身份：sub2api 开启会话绑定后，JWT 里的 bnd
  # claim = sha256(客户端IP + UA)，服务端直连的 IP/UA 必然与浏览器不同 → 校验失败，
  # 且 sub2api 会因指纹不符撤销该用户整个会话家族，把用户从浏览器踢下线。
  #
  # 代价：本地验签拿不到实时吊销状态（用户改密码后，旧 token 在自然过期前仍能看广场）。
  # 广场是只读价格页、不含账号与密钥数据，该窗口可接受。
  sub2api_jwt_secret: ""
  session_ttl_minutes: 30      # 嵌入会话有效期（进程内存储，重启失效）
  cache_seconds: 60            # 广场数据缓存，避免高频打线上库
  metrics_hours: 24            # 延迟/吞吐指标的统计窗口
  # 本地联调开关：开启后可访问 /embed/_dev 调试页，一键打开带身份的嵌入页，
  # 无需 sub2api 站点配合。它会暴露 /api/v1/embed/_dev/token，能签出任意 user_id
  # 的合法身份（等同于无密码登录成任何客户）——生产环境必须保持 false。
  dev_mode: false

# 生图 / 生视频：嵌入 sub2api 的自助生成页（菜单 URL 填 https://本站域名/embed/media）。
#
# 与 plaza 分成两个开关：这个页面会**真实花用户的钱**（视频提交成功即扣费，
# 即便内容审核拒绝也不退还），运营方可能想在开着广场的同时关掉它。
media:
  enabled: false
  # 生图 / 生视频 API 的基址。
  #
  # 【不复用 plaza.sub2api_base_url】后者被归一化成纯 origin 专供 CSP
  # frame-ancestors 使用，语义是「谁能嵌入本站」；这里是「本站去调谁的 API」。
  # 线上二者可能同域，但网关独立部署时就会分叉。
  gateway_base_url: ""         # 如 https://api.your-sub2api.com
  # 单用户同时进行中的视频任务上限，是防「狂点按钮把余额刷空」的最后一道闸。
  max_pending_videos: 3
  task_retention_days: 30      # 任务记录保留天数，由每日清理消费

  # 产物转存到 Cloudflare R2。
  #
  # 【为什么需要】图片走 b64 只在提交响应里返回一次，视频只有一个带认证的临时
  # 端点且上游保留期约半天。不转存的话，用户刷新页面图片就没了、视频过期后
  # 连后端也取不到——付了钱却留不住产物。
  #
  # 关闭时整体退化为「图片 inline、视频经后端代理」，生成本身不受影响。
  #
  # 建桶步骤：
  #   1. Cloudflare → R2 → Create bucket
  #   2. bucket → Settings → Public access → 绑定自定义域
  #      （必须用自定义域：R2 自带的 *.r2.dev 有严格限速，生产会被限流）
  #   3. R2 → Manage API Tokens → Create Token，权限选 Object Read & Write，
  #      作用域限定到这一个 bucket
  #   4. Account ID 在 R2 首页右侧
  #
  # 【凭据建议走环境变量】MONITOR_MEDIA_R2_ACCESS_KEY_ID /
  # MONITOR_MEDIA_R2_SECRET_ACCESS_KEY，不要写进配置文件。
  r2:
    enabled: false
    account_id: ""
    bucket: ""
    access_key_id: ""
    secret_access_key: ""
    public_base_url: ""        # 桶绑定的自定义域，如 https://media.example.com

log:
  level: info
